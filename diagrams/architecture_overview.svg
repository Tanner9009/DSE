<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6fd0"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold">MongoDB Replica-Set Distributed System — Architecture Overview</text>

  <!-- Host machine outer box -->
  <rect x="20" y="55" width="920" height="565" rx="10" fill="#f4f6fa" stroke="#444" stroke-width="2"/>
  <text x="40" y="80" font-size="16" font-weight="bold" fill="#222">Host Machine — EndeavourOS (Arch Linux)</text>
  <text x="40" y="98" font-size="12" fill="#555">RAM cap per container: 7.37 GB · CPU usage at idle: ~1.30 %</text>

  <!-- Python client -->
  <rect x="50" y="130" width="240" height="200" rx="8" fill="#fff4dc" stroke="#a67c00" stroke-width="2"/>
  <text x="170" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5a00">Python Benchmark Client</text>
  <text x="170" y="175" text-anchor="middle" font-size="11" fill="#444">benchmark.py</text>
  <text x="170" y="195" text-anchor="middle" font-size="11" fill="#444">pymongo · matplotlib</text>
  <line x1="70" y1="208" x2="270" y2="208" stroke="#a67c00" stroke-dasharray="3,3"/>
  <text x="80" y="226" font-size="11" fill="#222">Workload:</text>
  <text x="80" y="244" font-size="11" fill="#222">• MovieLens (~100k ratings)</text>
  <text x="80" y="262" font-size="11" fill="#222">• Write / read benchmarks</text>
  <text x="80" y="280" font-size="11" fill="#222">• Failover (docker stop)</text>
  <text x="80" y="306" font-size="11" fill="#222">Output: results/*.csv, *.md, *.png</text>

  <!-- Output folder -->
  <rect x="50" y="430" width="240" height="80" rx="8" fill="#eaf5e6" stroke="#477b2e" stroke-width="2"/>
  <text x="170" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a1d">results/</text>
  <text x="170" y="475" text-anchor="middle" font-size="11" fill="#444">report.md · results.csv</text>
  <text x="170" y="492" text-anchor="middle" font-size="11" fill="#444">charts/*.png</text>

  <!-- Arrow client -> results -->
  <line x1="170" y1="330" x2="170" y2="425" stroke="#477b2e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="178" y="380" font-size="10" fill="#477b2e">writes results</text>

  <!-- Docker engine -->
  <rect x="330" y="130" width="600" height="475" rx="10" fill="#e8eef8" stroke="#1f6fd0" stroke-width="2"/>
  <text x="350" y="155" font-size="15" font-weight="bold" fill="#1f6fd0">Docker Engine</text>

  <!-- bridge network -->
  <rect x="350" y="175" width="560" height="410" rx="8" fill="#fafcff" stroke="#7a9bd6" stroke-dasharray="6,3"/>
  <text x="370" y="198" font-size="13" font-weight="bold" fill="#34528a">Bridge network: mongo-cluster</text>

  <!-- mongo1 -->
  <rect x="370" y="220" width="160" height="120" rx="8" fill="#fdecec" stroke="#b03030" stroke-width="2"/>
  <text x="450" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#7d1a1a">mongo1</text>
  <text x="450" y="263" text-anchor="middle" font-size="11" fill="#222">image: mongo:latest</text>
  <text x="450" y="280" text-anchor="middle" font-size="11" fill="#222">replSet: rs0</text>
  <text x="450" y="298" text-anchor="middle" font-size="11" fill="#222">internal: 27017</text>
  <text x="450" y="320" text-anchor="middle" font-size="10" fill="#666">volume: mongo1_data → /data/db</text>

  <!-- mongo2 -->
  <rect x="555" y="220" width="160" height="120" rx="8" fill="#eaf2fd" stroke="#1f6fd0" stroke-width="2"/>
  <text x="635" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f3f87">mongo2</text>
  <text x="635" y="263" text-anchor="middle" font-size="11" fill="#222">image: mongo:latest</text>
  <text x="635" y="280" text-anchor="middle" font-size="11" fill="#222">replSet: rs0</text>
  <text x="635" y="298" text-anchor="middle" font-size="11" fill="#222">internal: 27017</text>
  <text x="635" y="320" text-anchor="middle" font-size="10" fill="#666">volume: mongo2_data → /data/db</text>

  <!-- mongo3 -->
  <rect x="740" y="220" width="160" height="120" rx="8" fill="#eaf2fd" stroke="#1f6fd0" stroke-width="2"/>
  <text x="820" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f3f87">mongo3</text>
  <text x="820" y="263" text-anchor="middle" font-size="11" fill="#222">image: mongo:latest</text>
  <text x="820" y="280" text-anchor="middle" font-size="11" fill="#222">replSet: rs0</text>
  <text x="820" y="298" text-anchor="middle" font-size="11" fill="#222">internal: 27017</text>
  <text x="820" y="320" text-anchor="middle" font-size="10" fill="#666">volume: mongo3_data → /data/db</text>

  <!-- mongo-express -->
  <rect x="555" y="370" width="160" height="100" rx="8" fill="#f5edfb" stroke="#7035a3" stroke-width="2"/>
  <text x="635" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#4f1d77">mongo-express</text>
  <text x="635" y="413" text-anchor="middle" font-size="11" fill="#222">admin web UI</text>
  <text x="635" y="431" text-anchor="middle" font-size="11" fill="#222">connects to all 3</text>
  <text x="635" y="449" text-anchor="middle" font-size="11" fill="#222">via replicaSet=rs0</text>

  <!-- Port mapping legend -->
  <rect x="370" y="495" width="530" height="80" rx="6" fill="#fffbe6" stroke="#a67c00"/>
  <text x="380" y="513" font-size="12" font-weight="bold" fill="#7a5a00">Host → Container port mapping (published by docker compose)</text>
  <text x="380" y="532" font-size="11" fill="#333">localhost:27017 → mongo1:27017     localhost:27018 → mongo2:27017     localhost:27019 → mongo3:27017</text>
  <text x="380" y="550" font-size="11" fill="#333">localhost:8081  → mongo-express:8081 (web dashboard)</text>
  <text x="380" y="568" font-size="10" fill="#555" font-style="italic">/etc/hosts maps mongo1/mongo2/mongo3 → 127.0.0.1 so the host-side driver can talk to the set by hostname.</text>

  <!-- Arrows: client to each mongo -->
  <path d="M290 200 C 320 200, 340 230, 370 240" fill="none" stroke="#1f6fd0" stroke-width="1.5" marker-end="url(#arrowblue)"/>
  <path d="M290 215 C 360 215, 480 215, 555 240" fill="none" stroke="#1f6fd0" stroke-width="1.5" marker-end="url(#arrowblue)"/>
  <path d="M290 230 C 380 230, 600 220, 740 240" fill="none" stroke="#1f6fd0" stroke-width="1.5" marker-end="url(#arrowblue)"/>
  <text x="298" y="195" font-size="10" fill="#1f6fd0">TCP 27017 / 27018 / 27019</text>

  <!-- Arrow: browser/admin to mongo-express (implicit) -->
  <path d="M290 255 C 360 280, 480 380, 555 405" fill="none" stroke="#7035a3" stroke-width="1.5" marker-end="url(#arrowblue)" stroke-dasharray="4,3"/>
  <text x="305" y="350" font-size="10" fill="#7035a3">browser :8081 (optional)</text>
</svg>
