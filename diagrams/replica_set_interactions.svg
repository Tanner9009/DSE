<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03030"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6fd0"/>
    </marker>
    <marker id="arrOplog" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f7a3a"/>
    </marker>
    <marker id="arrHB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="480" y="28" text-anchor="middle" font-size="19" font-weight="bold">Replica Set rs0 — Node Interactions &amp; Network Flows</text>

  <!-- Client -->
  <rect x="30" y="270" width="170" height="100" rx="8" fill="#fff4dc" stroke="#a67c00" stroke-width="2"/>
  <text x="115" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a00">Application Client</text>
  <text x="115" y="316" text-anchor="middle" font-size="11" fill="#444">benchmark.py</text>
  <text x="115" y="334" text-anchor="middle" font-size="11" fill="#444">(pymongo driver)</text>
  <text x="115" y="356" text-anchor="middle" font-size="10" fill="#666">resolves rs0 topology</text>

  <!-- PRIMARY (center top) -->
  <ellipse cx="540" cy="170" rx="120" ry="70" fill="#fdecec" stroke="#b03030" stroke-width="3"/>
  <text x="540" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#7d1a1a">mongo1 (example)</text>
  <text x="540" y="178" text-anchor="middle" font-size="20" font-weight="bold" fill="#b03030">PRIMARY</text>
  <text x="540" y="202" text-anchor="middle" font-size="11" fill="#444">accepts writes · serves reads by default</text>
  <text x="540" y="219" text-anchor="middle" font-size="11" fill="#444">priority 1 · 1 vote</text>

  <!-- SECONDARY 1 (left bottom) -->
  <ellipse cx="320" cy="500" rx="120" ry="70" fill="#eaf2fd" stroke="#1f6fd0" stroke-width="3"/>
  <text x="320" y="485" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f3f87">mongo2</text>
  <text x="320" y="508" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f6fd0">SECONDARY</text>
  <text x="320" y="530" text-anchor="middle" font-size="11" fill="#444">replicates oplog · 1 vote</text>
  <text x="320" y="547" text-anchor="middle" font-size="11" fill="#444">can serve reads (read-pref)</text>

  <!-- SECONDARY 2 (right bottom) -->
  <ellipse cx="770" cy="500" rx="120" ry="70" fill="#eaf2fd" stroke="#1f6fd0" stroke-width="3"/>
  <text x="770" y="485" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f3f87">mongo3</text>
  <text x="770" y="508" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f6fd0">SECONDARY</text>
  <text x="770" y="530" text-anchor="middle" font-size="11" fill="#444">replicates oplog · 1 vote</text>
  <text x="770" y="547" text-anchor="middle" font-size="11" fill="#444">can serve reads (read-pref)</text>

  <!-- write path: client -> PRIMARY -->
  <path d="M200 290 C 300 240, 380 200, 420 180" fill="none" stroke="#b03030" stroke-width="2.5" marker-end="url(#arrW)"/>
  <text x="260" y="234" font-size="11" font-weight="bold" fill="#b03030">writes → PRIMARY</text>
  <text x="260" y="249" font-size="10" fill="#b03030">(WriteConcern w=1 or majority)</text>

  <!-- read path: client -> SECONDARY (optional, dashed) -->
  <path d="M200 350 C 240 410, 240 470, 200 480" fill="none" stroke="#1f6fd0" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
  <text x="58" y="430" font-size="11" font-weight="bold" fill="#1f6fd0">reads (secondaryPreferred)</text>
  <text x="65" y="445" font-size="10" fill="#1f6fd0">eventual consistency</text>

  <!-- read path: client -> PRIMARY (default reads) -->
  <path d="M200 320 C 350 280, 380 230, 430 200" fill="none" stroke="#1f6fd0" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="270" y="290" font-size="10" fill="#1f6fd0">reads (primary) ↑</text>

  <!-- oplog replication: PRIMARY -> SECONDARY1 -->
  <path d="M470 230 C 420 320, 380 410, 360 440" fill="none" stroke="#0f7a3a" stroke-width="2.5" marker-end="url(#arrOplog)"/>
  <text x="345" y="335" font-size="11" font-weight="bold" fill="#0f7a3a">oplog</text>
  <text x="345" y="350" font-size="10" fill="#0f7a3a">replication</text>

  <!-- oplog replication: PRIMARY -> SECONDARY2 -->
  <path d="M610 230 C 660 320, 720 420, 730 440" fill="none" stroke="#0f7a3a" stroke-width="2.5" marker-end="url(#arrOplog)"/>
  <text x="680" y="335" font-size="11" font-weight="bold" fill="#0f7a3a">oplog</text>
  <text x="680" y="350" font-size="10" fill="#0f7a3a">replication</text>

  <!-- Heartbeats: all-to-all -->
  <path d="M440 210 C 380 290, 320 400, 320 430" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#arrHB)" marker-start="url(#arrHB)"/>
  <path d="M640 210 C 700 290, 760 400, 770 430" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#arrHB)" marker-start="url(#arrHB)"/>
  <path d="M440 500 C 540 500, 640 500, 650 500" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#arrHB)" marker-start="url(#arrHB)"/>

  <text x="500" y="385" font-size="10" fill="#666" font-style="italic">heartbeats (2 s interval, all-to-all)</text>

  <!-- Legend -->
  <rect x="30" y="50" width="280" height="170" rx="6" fill="#fafafa" stroke="#666"/>
  <text x="42" y="70" font-size="12" font-weight="bold">Legend</text>
  <line x1="42" y1="85" x2="76" y2="85" stroke="#b03030" stroke-width="2.5" marker-end="url(#arrW)"/>
  <text x="84" y="89" font-size="11">client write → PRIMARY</text>
  <line x1="42" y1="108" x2="76" y2="108" stroke="#1f6fd0" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
  <text x="84" y="112" font-size="11">client read (primary / secondary)</text>
  <line x1="42" y1="131" x2="76" y2="131" stroke="#0f7a3a" stroke-width="2.5" marker-end="url(#arrOplog)"/>
  <text x="84" y="135" font-size="11">oplog replication PRIMARY → SECONDARY</text>
  <line x1="42" y1="154" x2="76" y2="154" stroke="#888" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="84" y="158" font-size="11">heartbeat (every 2 s)</text>
  <text x="42" y="182" font-size="10" fill="#444">All 3 nodes are voting members.</text>
  <text x="42" y="197" font-size="10" fill="#444">Majority = 2 votes → quorum survives 1 node failure.</text>
  <text x="42" y="212" font-size="10" fill="#444">Primary role is dynamic — see failover note.</text>

  <!-- Failover note -->
  <rect x="630" y="50" width="300" height="170" rx="6" fill="#fff5f5" stroke="#b03030"/>
  <text x="642" y="70" font-size="12" font-weight="bold" fill="#7d1a1a">Failover behaviour</text>
  <text x="642" y="90" font-size="11" fill="#222">If the PRIMARY stops responding to heartbeats:</text>
  <text x="654" y="108" font-size="11" fill="#222">1. The remaining SECONDARIES detect the loss.</text>
  <text x="654" y="125" font-size="11" fill="#222">2. They hold an election (majority required).</text>
  <text x="654" y="142" font-size="11" fill="#222">3. One SECONDARY is promoted to PRIMARY.</text>
  <text x="654" y="159" font-size="11" fill="#222">4. The driver retries pending writes against</text>
  <text x="654" y="174" font-size="11" fill="#222">   the new PRIMARY automatically.</text>
  <text x="642" y="196" font-size="11" fill="#222">Write availability returns once a quorum elects</text>
  <text x="642" y="210" font-size="11" fill="#222">a new PRIMARY — typically a few seconds.</text>
</svg>
